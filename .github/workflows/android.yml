# 安卓版打包：在 GitHub 云端编译并用正式密钥签名，产出 APK，可直接发布到 Release。
# 手动运行：Actions → android-apk → Run workflow；勾选 publish 会同时发布 Release（版本号取自 app/pubspec.yaml）。
# 需要仓库 Settings → Secrets and variables → Actions 里有：
#   SUPABASE_URL、SUPABASE_ANON_KEY（anon / publishable key，与 ios-ipa 共用）
#   ANDROID_KEYSTORE_BASE64（签名密钥文件 .jks 的 base64 文本）、ANDROID_KEYSTORE_PASSWORD、
#   ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
# 签名必须与历史版本一致（否则无法覆盖安装），下面会校验证书指纹。
name: android-apk

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 打好后发布到 GitHub Release（并标为最新版）
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 历史版本（1.x ~ 2.1.0）正式签名证书的 SHA-256 指纹（公开信息，不是密钥）
  EXPECTED_CERT_SHA256: "82484836c4db2556cdefc299c0acb183bc68c5f1ce1c28fca6032ceb92d9b760"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "name=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${v##*+}" >> "$GITHUB_OUTPUT"

      - name: 写入 Supabase 配置
        working-directory: app
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::仓库还没有配置 SUPABASE_URL / SUPABASE_ANON_KEY 两个 Secret"; exit 1
          fi
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","AUTH_EMAIL_DOMAIN":"myfit.app"}' "$URL" "$KEY" > env.json

      - name: 依赖、检查与测试
        working-directory: app
        run: |
          flutter pub get
          dart analyze
          flutter test

      # 签名密钥放在测试之后、编译之前才写入，缩短它出现在运行环境里的时间
      - name: 写入签名密钥
        working-directory: app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for n in KS KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!n}" ]; then echo "::error::仓库还没有配置安卓签名的 4 个 Secret（缺 $n 对应的那一项）"; exit 1; fi
          done
          echo "$KS" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      - name: 编译 APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name "${{ steps.ver.outputs.name }}" --build-number "${{ steps.ver.outputs.code }}" \
            --dart-define-from-file=env.json

      - name: 校验签名与版本
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs "$apk" | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "证书指纹：$got"
          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名与历史版本不一致（指纹不符），不能覆盖安装，已停止"; exit 1
          fi
          cp "$apk" "my-fitness-${{ steps.ver.outputs.name }}.apk"
          rm -f env.json android/key.properties android/release.jks
          ls -l my-fitness-*.apk
          sha256sum my-fitness-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-fitness-android-apk
          path: app/my-fitness-*.apk
          retention-days: 30

      - name: 发布 Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          gh release create "v${V}" app/my-fitness-*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "我的健身 ${V}" \
            --notes "安卓安装包，直接安装即可覆盖旧版，数据保留。"
