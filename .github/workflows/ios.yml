# 苹果版（iPhone）打包：在 GitHub 的 macOS 机器上编译，产出「未签名」的 IPA（上传为 Actions 的构建产物，不发布），
# 再用全能签 / AltStore / Sideloadly 等工具自己签名安装。
# 发版请运行 release（发布）工作流，它会同时调用本流程和 android-apk，把两个安装包放进同一个 Release。
# 单独手动运行：Actions → ios-ipa → Run workflow，只打包，方便测试。版本号取自 app/pubspec.yaml。
# 需要仓库 Settings → Secrets and variables → Actions 里有（与 keepalive 共用）：
#   SUPABASE_URL、SUPABASE_ANON_KEY（anon / publishable key，可公开，不是 service_role）
name: ios-ipa

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "name=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${v##*+}" >> "$GITHUB_OUTPUT"

      - name: 写入 Supabase 配置
        working-directory: app
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::仓库还没有配置 SUPABASE_URL / SUPABASE_ANON_KEY 两个 Secret"; exit 1
          fi
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s","AUTH_EMAIL_DOMAIN":"myfit.app"}' "$URL" "$KEY" > env.json

      - name: 依赖、检查与测试
        working-directory: app
        run: |
          flutter pub get
          dart analyze
          flutter test

      - name: 编译（不签名）
        working-directory: app
        run: |
          flutter build ios --release --no-codesign \
            --build-name "${{ steps.ver.outputs.name }}" --build-number "${{ steps.ver.outputs.code }}" \
            --dart-define-from-file=env.json

      - name: 打成 IPA
        working-directory: app
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../my-fitness-ios-${V}-unsigned.ipa" Payload)
          rm -f env.json
          ls -l my-fitness-ios-*.ipa
          shasum -a 256 my-fitness-ios-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: my-fitness-ios-unsigned-ipa
          path: app/my-fitness-ios-*-unsigned.ipa
          retention-days: 30
